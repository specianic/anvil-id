[workspace]
# Virtual manifests do not infer the resolver from the edition; set it explicitly.
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
# Equal to the pinned toolchain (the only version we test). sqlx's floor is 1.94.
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# CI turns warnings into errors with `-D warnings`.
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# Internal crates (ARCHITECTURE.md §4)
anvil-core = { path = "crates/anvil-core" }
anvil-jose = { path = "crates/anvil-jose" }
anvil-storage = { path = "crates/anvil-storage" }
anvil-storage-sqlite = { path = "crates/anvil-storage-sqlite" }
anvil-storage-postgres = { path = "crates/anvil-storage-postgres" }
anvil-cache = { path = "crates/anvil-cache" }
anvil-web = { path = "crates/anvil-web" }
anvil-mail = { path = "crates/anvil-mail" }

# Third-party crates
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "process", "io-util"] }
axum = "0.8.9"
# Streamed NDJSON bodies (07-17 bulk export); already in the graph through axum.
futures-util = { version = "0.3.34", default-features = false }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Never default features (they include `any`), never `tls-rustls` (= ring), never `sqlite`/`sqlite-unbundled`.
# Backends add `sqlite-bundled` or `postgres` in their own manifests.
sqlx = { version = "0.9.1", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-aws-lc-rs",
  "macros",
  "migrate",
  "sqlx-toml",
  "uuid",
  "time",
  "json",
] }
aws-lc-rs = "1.19"
mimalloc = "0.1.52"
rust-embed = { version = "8.14", features = ["mime-guess", "interpolate-folder-path"] }
uuid = { version = "1.29", features = ["v7", "serde"] }
time = { version = "0.3.55", features = ["serde"] }
thiserror = "2"
async-trait = "0.1.92"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
url = "2"
clap = { version = "4.6", features = ["derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
# Use the re-export `testcontainers_modules::testcontainers`; do not add `testcontainers` directly.
testcontainers-modules = { version = "0.15", default-features = false, features = ["postgres", "redis"] }
tempfile = "3.27"

# Phase 2 (release 0.1). Every crate Phase 2 needs is declared here once.
# JOSE: jsonwebtoken is used for signature operations only (ARCHITECTURE.md §8.1).
# `use_pem` is required for the PKCS#8 (PRIVATE KEY PEM) signing path.
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
base64 = "0.23.1"
subtle = "2.6.1"
secrecy = "0.10.3"
zeroize = { version = "1.9.2", features = ["derive"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
# serde is off by default in minijinja 3.x; there is no `loader` feature.
minijinja = { version = "3.1.0", features = ["serde", "fuel"] }
# Never `rustls-tls` (enables ring).
lettre = { version = "0.11.24", default-features = false, features = [
  "tokio1-rustls",
  "aws-lc-rs",
  "webpki-roots",
  "smtp-transport",
  "builder",
  "hostname",
  "pool",
] }
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "time"] }
utoipa-axum = "0.3.0"
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
# 0.6.x: the line reqwest 0.13 already resolves, so cargo-deny reports no duplicate.
tower-http = { version = "0.6.11", features = ["cors", "set-header", "limit", "trace", "request-id", "util"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
# reqwest 0.13 `rustls` uses the aws-lc-rs provider (no ring).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "blocking"] }
# Built-in TLS listener: aws-lc-rs provider only.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
hyper = { version = "1.13", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "service"] }

# Phase 3 (release 0.2). Every crate Phase 3 needs is declared here once.
# rust-embed gains `interpolate-folder-path` (console embedding via $CARGO_MANIFEST_DIR; never `compression`);
# minijinja gains `fuel` (bounded execution of tenant-editable email templates).
# webauthn-rs verifies with crypto-glue/RustCrypto; its `rsa` use is public-key only (deny.toml wrapper exception).
webauthn-rs = { version = "0.6.2", features = ["danger-allow-state-serialisation", "conditional-ui"] }
# Never `qr` (pulls `image`) or `gen_secret` (secrets come from the aws-lc-rs RNG).
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "otpauth", "zeroize"] }
qrcodegen = "1.8"
governor = "0.10.4"
moka = { version = "0.12.16", features = ["sync"] }
ipnet = "2.12"

# Phase 4 (release 0.3). Every crate Phase 4 needs is declared here once.
# Fluent message catalogs for page i18n (UI-04); moka (above) caches upstream discovery/JWKS.
fluent-bundle = "0.16.0"
fluent-langneg = "0.14.2"
unic-langid = "0.9.6"

# Phase 5 (release 0.4). Every crate Phase 5 needs is declared here once.
# Redis: optional shared rate-limit backend, selected at runtime (`redis_url`). Never `tls-rustls` default
# provider features that pull ring; `tokio-rustls-comp` goes through the workspace rustls (aws-lc-rs).
redis = { version = "1.8.3", default-features = false, features = ["tokio-comp", "connection-manager", "script", "tokio-rustls-comp"] }
metrics = "0.24.6"
# No default features: we serve /metrics ourselves (no hyper listener, no push gateway).
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
# OTLP over HTTP/protobuf on reqwest's blocking client (reqwest gains `blocking` above); no tonic/gRPC.
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
# YAML for the declarative tenant config (CLI only).
serde-saphyr = "2.2.0"
# Attribute JSON Schemas: offline only (no remote $ref resolution).
jsonschema = { version = "0.63.1", default-features = false }

# Phase 6 (release 1.0). Every crate Phase 6 needs is declared here once.
# XML-DSig for the SAML SP (ARCHITECTURE.md §20 D4): the bergshamra sub-crates, never the top `bergshamra`
# crate (clap, bergshamra-enc). Providers are mutually exclusive: aws-lc only, never the RustCrypto default.
# bergshamra-keys -> tsp-ltv pulls chrono: the single scoped wrapper exception in deny.toml (decision Q2).
bergshamra-dsig = { version = "0.12.0", default-features = false, features = ["aws-lc"] }
bergshamra-keys = { version = "0.12.0", default-features = false, features = ["aws-lc"] }
bergshamra-xml = { version = "0.12.0", default-features = false }
# The one XML parser (bergshamra's DOM). Always `Parser::with_forbid_dtd(true)`: DTDs are parsed by default.
uppsala = "0.12.1"
# DNS TXT domain verification. Default features (`system-config`, `tokio`) pull no TLS/ring.
hickory-resolver = "0.26.4"
# Dev-only: local UDP DNS stub encodes answers (same line as hickory-resolver's own hickory-proto).
hickory-proto = "0.26.4"
# Domain rules in anvil-core (pure data/algorithms, no I/O).
psl = "2.1"
idna = "1.1.0"
# DEFLATE for the SAML HTTP-Redirect binding: pure Rust (miniz_oxide).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Phase 7 (release 1.0). Every crate Phase 7 needs is declared here once.
# Legacy password-hash verification only (ADM-08): imported bcrypt/scrypt/Firebase scrypt hashes are verified
# once, then re-hashed with Argon2id. aws-lc-rs has no scrypt or bcrypt and FFI needs unsafe. blowfish and
# salsa20 are scoped to these wrappers in deny.toml (ARCHITECTURE.md §2; owner review pending, 07-01).
# PBKDF2, SHA-2 and AES-CTR stay on aws-lc-rs. No `phc`/`mcf`/`rayon` on scrypt; bcrypt `verify` needs `alloc`.
scrypt = { version = "0.12.0", default-features = false }
bcrypt = { version = "0.19.3", default-features = false, features = ["alloc"] }

# Dev-only (tests).
proptest = "1.12.0"
insta = { version = "1.49.0", features = ["json"] }
wiremock = "0.6.5"

# 50+ integration-test binaries each link the whole dependency graph; full debuginfo made
# target/ grow by hundreds of GB. Line tables keep usable backtraces for our crates.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
