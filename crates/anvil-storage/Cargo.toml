[package]
name = "anvil-storage"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Shared storage contract test suite, used by the backends as a dev-dependency.
contract = ["dep:tokio"]
# Self-cleaning Postgres test containers (anvil_storage::postgres_container), dev-only.
postgres-container = ["dep:testcontainers-modules"]

[dependencies]
anvil-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
testcontainers-modules = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "macros"] }
uuid.workspace = true
