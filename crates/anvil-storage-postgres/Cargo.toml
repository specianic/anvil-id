[package]
name = "anvil-storage-postgres"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anvil-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["postgres"] }
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
# Only with the `testing` feature (test support); never in a release build.
testcontainers-modules = { workspace = true, optional = true }

[features]
testing = ["dep:testcontainers-modules"]

[dev-dependencies]
anvil-jose.workspace = true
anvil-storage = { workspace = true, features = ["contract"] }
anvil-storage-postgres = { path = ".", features = ["testing"] }
testcontainers-modules.workspace = true
tokio.workspace = true
