{% extends "base.html" %}
{% block heading %}{{ heading }}{% endblock %}
{% block content %}
<p class="anvil-lead" id="message-body" data-message-key="{{ body_key }}">{{ body }}</p>
{% if page.links.login %}
<nav class="anvil-links" aria-label="{{ t("nav.next_steps") }}">
<a id="link-login" href="{{ page.links.login }}">{{ t("message.go_to_sign_in") }}</a>
</nav>
{% endif %}
{% endblock %}
