# cargo-deny policy (ARCHITECTURE.md §2). Run with `just deny` (= `cargo deny --locked check`).
# Current config format: no `version` keys.

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
all-features = false

[advisories]
yanked = "deny"
# `unmaintained` defaults to "workspace" scope (cargo-deny >= 0.22), so transitive
# unmaintained crates do not fail CI on their own.

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "MIT-0",
  "CC0-1.0",
  "Unlicense",
  # quoted_printable (via lettre, SMTP mail). Public-domain equivalent, OSI approved.
  "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies have no version; `publish = false` makes this apply.
allow-wildcard-paths = true
deny = [
  { crate = "openssl", reason = "single crypto backend: aws-lc-rs" },
  { crate = "openssl-sys", reason = "single crypto backend: aws-lc-rs" },
  { crate = "native-tls", reason = "rustls only" },
  { crate = "ring", reason = "single crypto backend: aws-lc-rs (not currently in graph; if it becomes unavoidable, use wrappers = [..] and document)" },
  # webauthn-rs (M2) will need `{ crate = "rsa", wrappers = ["crypto-glue"] }` per ARCHITECTURE.md §2.
  # Not added now because no such crate is in the graph.
  { crate = "rsa", reason = "RUSTSEC-2023-0071 (Marvin), no fix" },
  { crate = "chrono", reason = "time crate only" },
  { crate = "samael", reason = "C XML security libs" },
  { crate = "xmlsec", reason = "C XML security libs" },
  { crate = "oxide-auth", reason = "dormant; we own the OAuth state machine" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
