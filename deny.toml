# cargo-deny policy (ARCHITECTURE.md §2). Run with `just deny` (= `cargo deny --locked check`).
# Current config format: no `version` keys.

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
all-features = false

[advisories]
yanked = "deny"
# `unmaintained` defaults to "workspace" scope (cargo-deny >= 0.22), so transitive
# unmaintained crates do not fail CI on their own.
ignore = [
  # `rsa` is reachable only through crypto-glue (bans.deny wrapper below), i.e. inside webauthn-rs,
  # which uses it to verify authenticator signatures with public keys. Marvin is a timing attack on
  # private-key operations; we never hold RSA private keys in RustCrypto (our signing is aws-lc-rs).
  { id = "RUSTSEC-2023-0071", reason = "rsa used for public-key verification only, via crypto-glue in webauthn-rs (ARCHITECTURE.md §2)" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "MIT-0",
  "CC0-1.0",
  "Unlicense",
  # quoted_printable (via lettre, SMTP mail). Public-domain equivalent, OSI approved.
  "0BSD",
]
confidence-threshold = 0.9

# MPL-2.0 (file-level copyleft) is accepted per crate, not globally: we use these crates unmodified.
[[licenses.exceptions]]
crate = "webauthn-rs"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "webauthn-rs-core"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "webauthn-rs-proto"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "webauthn-attestation-ca"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "crypto-glue"
allow = ["MPL-2.0"]
# option-ext: via rust-embed `interpolate-folder-path` (shellexpand -> dirs), build-time proc-macro only.
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies have no version; `publish = false` makes this apply.
allow-wildcard-paths = true
deny = [
  { crate = "openssl", reason = "single crypto backend: aws-lc-rs" },
  { crate = "openssl-sys", reason = "single crypto backend: aws-lc-rs" },
  { crate = "native-tls", reason = "rustls only" },
  { crate = "ring", reason = "single crypto backend: aws-lc-rs (not currently in graph; if it becomes unavoidable, use wrappers = [..] and document)" },
  { crate = "rsa", wrappers = ["crypto-glue"], reason = "RUSTSEC-2023-0071 (Marvin) concerns private-key ops; webauthn-rs verifies with public keys only (ARCHITECTURE.md §2)" },
  # The ONLY chrono exception (decision Q2, option A; owner review pending). bergshamra-keys hard-depends on
  # tsp-ltv, which hard-depends on chrono; nothing else may pull chrono and our code uses `time`.
  { crate = "chrono", wrappers = ["tsp-ltv"], reason = "bergshamra-keys -> tsp-ltv (X.509 trust facade) needs chrono; our code stays on `time` (ARCHITECTURE §2, decision Q2)" },
  # Legacy password-hash verification only (ADM-08): imported hashes are verified once, then re-hashed with
  # Argon2id. No key material is generated or stored by these crates. PBKDF2/SHA-2/AES-CTR stay on aws-lc-rs.
  # Approved by the project owner on 2026-11-27 (07-01). ARCHITECTURE.md §2.
  { crate = "blowfish", wrappers = ["bcrypt"], reason = "bcrypt verification of imported hashes only (ADM-08)" },
  { crate = "salsa20", wrappers = ["scrypt"], reason = "scrypt verification of imported hashes only (ADM-08)" },
  { crate = "samael", reason = "C XML security libs" },
  { crate = "xmlsec", reason = "C XML security libs" },
  { crate = "oxide-auth", reason = "dormant; we own the OAuth state machine" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
