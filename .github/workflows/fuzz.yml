# Fuzzing (SEC-07). Nightly: each target runs for 5 minutes. PRs touching parsing code, and pushes
# to main that touch the fuzz crate or the parsers it covers: a short smoke run of every target
# (ci.yml's fuzz-build job type-checks the targets on every push). Entry points are the justfile
# recipes (scripts owned by plan 02-17).
name: fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "fuzz/**"
      - "crates/anvil-core/src/oauth/**"
      - "crates/anvil-jose/src/**"
      - "crates/anvil-core/src/policy/home_realm.rs"
      - "crates/anvil-web/src/adapters/saml_xml.rs"
  pull_request:
    paths:
      - "crates/anvil-jose/**"
      - "crates/anvil-core/**"
      - "crates/anvil-web/src/adapters/saml_xml.rs"
      - "fuzz/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: fuzz smoke
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-fuzz@0.13.2
      - run: just fuzz-smoke

  nightly:
    name: fuzz ${{ matrix.target }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            jwt_decode,
            client_assertion,
            authorize_parse,
            redirect_match,
            saml_response_parse,
            saml_metadata_parse,
            org_domain_parse,
          ]
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-fuzz@0.13.2
      - run: just fuzz ${{ matrix.target }} 300
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/
          if-no-files-found: warn
