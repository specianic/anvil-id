# OpenID conformance: starts the pinned conformance suite and a fresh anvilid over TLS (throwaway
# self-signed certificate generated at run time), provisions it through /setup and the admin API, runs
# the Basic OP, Config OP, Form Post OP (oidcc-formpost-basic-certification-test-plan), RP-Initiated
# Logout OP and Back-Channel Logout OP plans against one suite instance and one anvilid (back-channel
# logout tokens reach the suite through a per-run callback CA and a 127.0.0.1/32 outbound allow-list,
# both operator settings), and enforces the committed expected-skips and expected-failures
# files exactly. Same entry point as local runs: `tests/conformance/run.sh all` (= `just conformance`).
# Also runs on `v*` tag pushes; those runs keep the `conformance-results` artifact for 90 days.
# No secrets.
name: conformance

on:
  push:
    branches: [main]
    # Release tags: the release candidate's run is kept as evidence (90-day artifact below).
    tags: ["v*"]
  workflow_dispatch:
  # PRs that touch protocol code, the theme (browser automation selectors, form_post page) or the
  # harness. crates/** covers crates/anvil-core/src/oauth/**, service/{authorize,token,consent}.rs and
  # crates/anvil-web/src/protocol/**, plus everything they depend on (storage, JOSE, limiter).
  pull_request:
    paths:
      - "crates/**"
      - "tests/conformance/**"
      - ".github/workflows/conformance.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "themes/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  conformance:
    name: OpenID conformance (Basic, Config, Form Post, RP-Initiated and Back-Channel Logout OP)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # One suite instance and one fresh anvilid for all five plans, run in sequence by the
      # suite's run-test-plan.py: basic, config, formpost, logout, backchannel.
      - name: Run conformance suite (basic, config, formpost, logout, backchannel)
        run: tests/conformance/run.sh all
      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-results
          path: conformance-results/
          if-no-files-found: warn
          # Tag runs are release evidence (docs/CERTIFICATION.md) and are kept for 90 days (the maximum
          # without a repository setting change). 0 = the repository default, unchanged for other runs.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 0 }}
