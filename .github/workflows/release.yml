# Tag-triggered release (OPS-01). Pushing a tag vX.Y.Z (or vX.Y.Z-suffix for a prerelease):
#   1. builds static musl binaries for x86_64/aarch64 Linux (scripts/build-musl.sh, native runners)
#      and native macOS binaries (aarch64, x86_64),
#   2. packages each as anvilid-<version>-<target>.tar.gz + .sha256 (scripts/release-artifacts.sh),
#   3. builds the container image for linux/amd64 and linux/arm64 from those binaries, enforces the
#      50 MB / nonroot / smoke-test gate per arch (scripts/docker-image.sh), pushes it to
#      ghcr.io/specianic/anvil-id as <version> (and latest for non-prerelease tags),
#   4. attests build provenance for archives and image and creates the GitHub Release.
#
# workflow_dispatch is a dry run: steps 1-3 including the image gate, but nothing is pushed,
# attested or released. See docs/RELEASING.md.
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/specianic/anvil-id

jobs:
  meta:
    name: version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Derive version
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          crate=$(sed -nE '0,/^version *= *"([^"]+)"/s//\1/p' crates/anvilid/Cargo.toml)
          if [[ "$REF_TYPE" == "tag" ]]; then
            version=${REF_NAME#v}
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "error: tag $REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
              exit 1
            fi
            # The binary reports CARGO_PKG_VERSION (`anvilid --version`); a release must match it.
            if [[ "$version" != "$crate" ]]; then
              echo "error: tag $REF_NAME does not match crates/anvilid version $crate" >&2
              exit 1
            fi
            publish=true
          else
            version="${crate}-dryrun.${GITHUB_SHA::7}"
            publish=false
          fi
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"
          echo "version $version, prerelease $prerelease, publish $publish" >>"$GITHUB_STEP_SUMMARY"

  linux:
    name: linux ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No cache: release binaries are built from a clean tree.
      - name: Build static binary
        run: scripts/build-musl.sh ${{ matrix.target }}
      - name: Check version
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          out=$(target/${{ matrix.target }}/release/anvilid --version)
          echo "$out"
          [[ "$out" == "anvilid ${VERSION%%-dryrun.*}" ]]
      - name: Package
        run: scripts/release-artifacts.sh target/${{ matrix.target }}/release/anvilid ${{ matrix.target }} ${{ needs.meta.outputs.version }} dist
      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
      - name: Upload binary for the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/anvilid
          if-no-files-found: error

  macos:
    name: macos ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
          cmake --version || true
      - name: Build
        run: cargo build --release --locked -p anvilid --target ${{ matrix.target }}
      - name: Check version
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          out=$(target/${{ matrix.target }}/release/anvilid --version)
          echo "$out"
          [[ "$out" == "anvilid ${VERSION%%-dryrun.*}" ]]
          file target/${{ matrix.target }}/release/anvilid
          otool -L target/${{ matrix.target }}/release/anvilid
      - name: Package
        run: scripts/release-artifacts.sh target/${{ matrix.target }}/release/anvilid ${{ matrix.target }} ${{ needs.meta.outputs.version }} dist
      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  image:
    name: container image
    needs: [meta, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: bins
      - name: Place binaries
        run: |
          set -euo pipefail
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            mkdir -p target/$t/release
            install -m 0755 bins/bin-$t/anvilid target/$t/release/anvilid
          done
          file target/*/release/anvilid
      - name: Set up QEMU (arm64 smoke test)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      # Gate each arch with the default docker builder (images load into the local daemon) before
      # buildx switches the default builder to a docker-container one for the multi-arch push.
      - name: Gate linux/amd64 (size, nonroot, smoke test)
        run: TARGET=x86_64-unknown-linux-musl PREBUILT=1 scripts/docker-image.sh anvilid:gate-amd64
      - name: Gate linux/arm64 (size, nonroot, smoke test)
        run: TARGET=aarch64-unknown-linux-musl PREBUILT=1 SMOKE_PORT=18081 scripts/docker-image.sh anvilid:gate-arm64
      - name: Set up Buildx
        if: needs.meta.outputs.publish == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch image
        id: push
        if: needs.meta.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          tags=(-t "$IMAGE:$VERSION")
          if [[ "$PRERELEASE" != "true" ]]; then tags+=(-t "$IMAGE:latest"); fi
          created=$(git log -1 --format=%cI "$GITHUB_SHA")
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            "${tags[@]}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$created" \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            --annotation "index:org.opencontainers.image.description=Self-hostable OpenID Connect provider" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --provenance=false \
            --metadata-file buildx-meta.json \
            --push \
            .
          digest=$(jq -r '."containerimage.digest"' buildx-meta.json)
          [[ "$digest" == sha256:* ]]
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "Pushed \`$IMAGE:$VERSION\` ($digest)" >>"$GITHUB_STEP_SUMMARY"
      - name: Attest image provenance
        if: needs.meta.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: github release
    needs: [meta, linux, macos, image]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Verify checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum -c ./*.sha256
          test "$(ls ./*.tar.gz | wc -l)" -eq 4
      - name: Attest archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          cat >notes.md <<EOF
          ## Install

          Static Linux binaries (x86_64, aarch64) and macOS binaries (Apple silicon, Intel) are
          attached below. Verify the download, then run it:

          \`\`\`bash
          sha256sum -c anvilid-${VERSION}-x86_64-unknown-linux-musl.tar.gz.sha256
          gh attestation verify anvilid-${VERSION}-x86_64-unknown-linux-musl.tar.gz --repo ${GITHUB_REPOSITORY}
          tar -xzf anvilid-${VERSION}-x86_64-unknown-linux-musl.tar.gz
          ./anvilid-${VERSION}-x86_64-unknown-linux-musl/anvilid serve
          \`\`\`

          Container image (linux/amd64, linux/arm64):

          \`\`\`bash
          docker run -p 8080:8080 ${IMAGE}:${VERSION}
          \`\`\`

          The first start prints a one-time setup URL. See the README for details.

          EOF
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/*.tar.gz dist/*.sha256 \
            --verify-tag \
            --title "AnvilID $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            "${flags[@]}"
