# Load and HA gates (QUAL-05, OPS-03): tests/load/run-perf.sh (k6 token benchmark, median of 3,
# idle memory) and tests/load/run-ha.sh (3 nodes behind HAProxy: concurrent first start, restarts
# under load, exactly-once webhooks, shared rate limit).
#
# Runs on push to main (server, load and HA files), nightly and on demand; not on pull requests
# (05-CONTEXT Q2). A missed target fails the job. Public 4 vCPU runner, shared by k6, Postgres and
# AnvilID (see tests/load/README.md); the targets change only by an owner decision.
name: load

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "scripts/docker-image.sh"
      - "tests/load/**"
      - "deploy/compose/ha/**"
      - ".github/workflows/load.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      which:
        description: Which test to run
        type: choice
        options: [both, perf, ha]
        default: both

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  K6_VERSION: "2.4.0"

jobs:
  perf:
    name: perf (token endpoint, idle memory)
    if: github.event_name != 'workflow_dispatch' || inputs.which == 'both' || inputs.which == 'perf'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Same image build as e2e.yml (musl binary in the Rust alpine image, size gate, smoke test).
      - run: just docker-image
      - name: Install k6 ${{ env.K6_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/k6.tgz" \
            "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/k6.tgz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/k6-v${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6
          k6 version
      - name: Runner
        run: |
          {
            echo "### Runner"
            echo
            echo "$(nproc) vCPU, $(awk '/MemTotal/{printf "%.1f GiB", $2/1048576}' /proc/meminfo), $(uname -r)"
            echo
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Token benchmark (median of 3) and idle memory
        run: tests/load/run-perf.sh
      - name: Upload summaries and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-perf
          path: target/load/
          if-no-files-found: warn

  ha:
    name: ha (restarts, exactly-once webhooks, shared limit)
    if: github.event_name != 'workflow_dispatch' || inputs.which == 'both' || inputs.which == 'ha'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just docker-image
      - name: Install k6 ${{ env.K6_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/k6.tgz" \
            "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/k6.tgz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/k6-v${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6
          k6 version
      - name: HA test
        run: tests/load/run-ha.sh
      - name: Upload summaries and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-ha
          path: target/load/
          if-no-files-found: warn
