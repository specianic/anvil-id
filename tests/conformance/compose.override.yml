# Lets the suite's server container (including its HtmlUnit browser) reach anvilid listening on the
# host (0.0.0.0:9443, TLS) under the name used as the issuer: https://host.docker.internal:9443.
services:
  server:
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # Replace the upstream ./mongo/data bind mount (same target, so compose overrides it) with a named
  # volume: `compose down -v` then deletes it, every run starts with an empty database, and no
  # root-owned files are left in ./suite.
  mongodb:
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
