{{- include "anvilid.validate" . }}
{{- $sqlite := eq .Values.database.type "sqlite" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anvilid.fullname" . }}
  labels:
    {{- include "anvilid.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if $sqlite }}
  # One SQLite file, one writer: never run the old and the new pod together.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "anvilid.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "anvilid.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      # Service links would inject ANVILID_* variables (ANVILID_PORT, ...) for a Service named
      # anvilid; the configuration namespace stays ours.
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: anvilid
          image: {{ include "anvilid.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: ANVILID_LISTEN
              value: "0.0.0.0:{{ .Values.service.port }}"
            - name: ANVILID_PUBLIC_URL
              value: {{ .Values.publicUrl | quote }}
            {{- if .Values.insecureHttp }}
            - name: ANVILID_INSECURE_HTTP
              value: "true"
            {{- end }}
            - name: ANVILID_LOG_FORMAT
              value: {{ .Values.log.format | quote }}
            - name: RUST_LOG
              value: {{ .Values.log.level | quote }}
            - name: ANVILID_SHUTDOWN_DRAIN
              value: "{{ .Values.shutdownDrainSeconds }}s"
            {{- if $sqlite }}
            - name: ANVILID_DATA_DIR
              value: /data
            {{- else }}
            - name: ANVILID_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name | quote }}
                  key: {{ .Values.existingSecret.databaseUrlKey | quote }}
            - name: ANVILID_DATABASE_MAX_CONNECTIONS
              value: {{ .Values.database.maxConnections | quote }}
            {{- end }}
            {{- if .Values.existingSecret.name }}
            - name: ANVILID_KEK
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name | quote }}
                  key: {{ .Values.existingSecret.kekKey | quote }}
            {{- end }}
            {{- if .Values.redis.existingSecretKey }}
            - name: ANVILID_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "redis.existingSecretKey needs existingSecret.name" .Values.existingSecret.name | quote }}
                  key: {{ .Values.redis.existingSecretKey | quote }}
            {{- else if .Values.redis.url }}
            - name: ANVILID_REDIS_URL
              value: {{ .Values.redis.url | quote }}
            {{- end }}
            {{- if include "anvilid.hasRedis" . }}
            - name: ANVILID_RATE_LIMIT_REDIS_FAILURE
              value: {{ .Values.redis.failureMode | quote }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: ANVILID_METRICS_LISTEN
              value: "0.0.0.0:{{ .Values.metrics.port }}"
            {{- end }}
            {{- if .Values.otel.endpoint }}
            - name: ANVILID_OTEL_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: ANVILID_OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            {{- end }}
            {{- if .Values.trustedProxies }}
            - name: ANVILID_TRUSTED_PROXIES
              value: {{ .Values.trustedProxies | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          # Migrations run before the listener starts; allow up to two minutes for the first start.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Turns 503 at SIGTERM (drain) and when the database is unreachable.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $sqlite }}
            - name: data
              mountPath: /data
            {{- end }}
      volumes:
        # The root filesystem is read-only; SQLite and the runtime may need a scratch directory.
        - name: tmp
          emptyDir: {}
        {{- if $sqlite }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "anvilid.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
