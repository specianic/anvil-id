# Throwaway Postgres for the chart's CI install (ct install with ci/postgres-values.yaml on kind).
# Not a production database: no persistence, and the password below is a local-only placeholder
# for this test cluster (the Service is cluster-internal). Applied by .github/workflows/deploy.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres-ci
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-ci
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-ci
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
          env:
            - name: POSTGRES_USER
              value: anvilid
            - name: POSTGRES_PASSWORD
              value: anvilid-local-only
            - name: POSTGRES_DB
              value: anvilid
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "anvilid", "-d", "anvilid"]
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres-ci
spec:
  selector:
    app.kubernetes.io/name: postgres-ci
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
