# AnvilID with Postgres: a starting point for a single-host deployment.
#
#   cp deploy/compose/postgres/.env.example deploy/compose/postgres/.env   # then fill it in
#   docker compose -f deploy/compose/postgres/compose.yml up -d
#   docker compose -f deploy/compose/postgres/compose.yml logs anvilid | grep "Setup URL"
#
# Secrets come from the environment or the .env file next to this file (gitignored); nothing
# secret is stored here:
#   ANVILID_KEK        base64 32-byte key-encryption key: `openssl rand -base64 32`. Keep a copy
#                      outside the host; without it the encrypted data cannot be read.
#   POSTGRES_PASSWORD  database password, URL-safe: `openssl rand -hex 24`
#   ANVILID_PUBLIC_URL public base URL (default http://localhost:8080; use https behind a proxy)
#   ANVILID_IMAGE      image (default ghcr.io/specianic/anvil-id:0.4.0)
#
# Add the observability overlay (OpenTelemetry Collector + Prometheus) with
#   -f deploy/compose/observability/compose.yml
name: anvilid

services:
  postgres:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    environment:
      POSTGRES_USER: anvilid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see .env.example)}
      POSTGRES_DB: anvilid
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anvilid -d anvilid"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql
    # Not published: only anvilid reaches the database.

  anvilid:
    image: ${ANVILID_IMAGE:-ghcr.io/specianic/anvil-id:0.4.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANVILID_PUBLIC_URL: ${ANVILID_PUBLIC_URL:-http://localhost:8080}
      ANVILID_LISTEN: 0.0.0.0:8080
      ANVILID_DATABASE_URL: postgres://anvilid:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/anvilid
      ANVILID_KEK: ${ANVILID_KEK:?set ANVILID_KEK (see .env.example)}
      ANVILID_LOG_FORMAT: json
      RUST_LOG: info
      # Prometheus metrics on their own listener, not on the public port.
      ANVILID_METRICS_LISTEN: 0.0.0.0:9464
      # SIGTERM: readiness 503 for 10 s, then graceful shutdown: in-flight requests finish and
      # background jobs get up to 20 s (stop_grace_period covers drain + jobs + margin).
      ANVILID_SHUTDOWN_DRAIN: 10s
    stop_grace_period: 40s
    # Exec form: the distroless image has no shell. Probes /health/ready on the loopback.
    healthcheck:
      test: ["CMD", "/usr/local/bin/anvilid", "healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      - "8080:8080"
      # Metrics only on the host loopback; scrape them from Prometheus on the compose network.
      - "127.0.0.1:9464:9464"

volumes:
  pgdata:
