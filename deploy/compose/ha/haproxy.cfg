# HAProxy for the HA test stack (deploy/compose/ha/compose.yml).
#
# - Active health checks on /health/ready every second; two failures take a node out, two
#   successes bring it back. A node that received SIGTERM answers 503 there during its drain
#   delay, so it leaves the pool before it stops accepting connections.
# - Retries only on connection failures (`retry-on conn-failure`), never on empty responses or
#   response timeouts: a retried POST /token with a refresh token would trip reuse detection and
#   revoke the token family.
# - Container IPs can change across restarts: servers are re-resolved through Docker's DNS.

global
    log stdout format raw local0 info
    maxconn 20000

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 2s
    timeout client 30s
    timeout server 30s
    timeout http-keep-alive 10s
    timeout check 2s
    retries 2
    retry-on conn-failure
    option redispatch 1
    default-server inter 1s fall 2 rise 2 resolvers docker init-addr last,libc,none

frontend anvilid
    bind :8080
    option forwardfor
    default_backend anvilid

backend anvilid
    balance roundrobin
    option httpchk GET /health/ready
    http-check expect status 200
    server node1 node1:8080 check
    server node2 node2:8080 check
    server node3 node3:8080 check
