# cargo-fuzz crate (SEC-07). Not a member of the main workspace: it has its own [workspace] table
# and Cargo.lock, so fuzz-only dependencies never enter the main lockfile or the release graph.
# Run through scripts/fuzz.sh (`just fuzz-smoke`, `just fuzz <target> <seconds>`); needs nightly.
[package]
name = "anvil-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
anvil-core = { path = "../crates/anvil-core" }
anvil-jose = { path = "../crates/anvil-jose" }
arbitrary = { version = "1.5", features = ["derive"] }
base64 = "0.23.1"
libfuzzer-sys = "0.4.13"
serde_json = { version = "1", features = ["float_roundtrip"] }
time = "0.3.55"
url = "2"

[profile.release]
debug = 1

[[bin]]
name = "jwt_decode"
path = "fuzz_targets/jwt_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_assertion"
path = "fuzz_targets/client_assertion.rs"
test = false
doc = false
bench = false

[[bin]]
name = "authorize_parse"
path = "fuzz_targets/authorize_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "redirect_match"
path = "fuzz_targets/redirect_match.rs"
test = false
doc = false
bench = false

[[bin]]
name = "registration_parse"
path = "fuzz_targets/registration_parse.rs"
test = false
doc = false
bench = false
